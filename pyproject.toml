[project]
name = "paneglow"
version = "0.0.0"
description = "macOS Codex Micro dashboard and launcher for parallel Claude Code Desktop sessions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
paneglow = "paneglow.cli:main"

[project.urls]
Repository = "https://github.com/JeongJaeSoon/paneglow"
Issues = "https://github.com/JeongJaeSoon/paneglow/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["integration: needs a real Codex Micro"]
