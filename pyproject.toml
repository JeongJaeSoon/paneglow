[project]
name = "paneglow"
version = "0.0.0"
description = "Codex Micro macropad as a live dashboard for parallel Claude Code panes in iTerm2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["iterm2>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
paneglow = "paneglow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
